<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="TV Lowlights logo">
  <style>
    :root { --fg: oklch(0.145 0 0); --bad: oklch(0.577 0.245 27.325); }
    @media (prefers-color-scheme: dark) {
      :root { --fg: oklch(0.985 0 0); --bad: oklch(0.704 0.191 22.216); }
    }
  </style>
  <!-- TV body -->
  <rect x="3" y="11" width="42" height="28" rx="5" stroke="var(--fg)" stroke-width="2.5" />
  <!-- antenna / legs -->
  <path d="M17 39l-4 6M31 39l4 6" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round" />
  <!-- crashing ratings line -->
  <path d="M9 16l6 5 6-3 6 7 7 7" stroke="var(--bad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- end-of-line low point -->
  <circle cx="34" cy="32" r="2.5" fill="var(--bad)" />
</svg>
